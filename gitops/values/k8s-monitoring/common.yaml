# Shared default Helm values for the Grafana k8s-monitoring chart.
# Keep values here when every cluster should use the same observability pipeline defaults.
# Put cluster-specific identity, destinations, collectors, or pod settings in gitops/values/k8s-monitoring/<cluster>.yaml.

destinations:
  loki:
    type: loki
    url: http://10.10.30.102:3100/loki/api/v1/push

  prometheus:
    type: prometheus
    url: http://10.10.30.102:9090/api/v1/write

  tempo:
    type: otlp
    protocol: grpc
    url: 10.10.30.102:4317
    tls:
      insecure: true
      insecureSkipVerify: true
    metrics:
      enabled: false
    logs:
      enabled: false
    traces:
      enabled: true
    processors:
      serviceGraphMetrics:
        enabled: true
        destinations: ["prometheus"]

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  kube-state-metrics:
    namespace: kube-system
    labelMatchers:
      app.kubernetes.io/name: kube-state-metrics

hostMetrics:
  # NixOS Alloy owns host metrics for every Linux machine, including the
  # Kubernetes nodes. Keep this chart focused on cluster and workload signals.
  enabled: false

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics

applicationObservability:
  enabled: true
  collector: alloy-receiver
  destinations: ["loki", "prometheus", "tempo"]
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
  connectors:
    grafanaCloudMetrics:
      enabled: false
    spanMetrics:
      enabled: true

collectors:
  alloy-metrics:
    presets: [clustered, statefulset]

  alloy-logs:
    presets: [filesystem-log-reader, daemonset]

  alloy-receiver:
    presets: [daemonset]
    extraService:
      enabled: true
      fullname: otel-collector

telemetryServices:
  kube-state-metrics:
    deploy: false
  node-exporter:
    deploy: false
