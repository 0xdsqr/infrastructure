# Shared default Helm values for the MetalLB chart.
# Keep values here when every cluster should use the same controller/speaker defaults.
# Put cluster-specific resource sizing or address-pool-adjacent settings in gitops/components/metallb/overlays/<cluster>/values-overrides.yaml.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

speaker:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# hub-a uses L2Advertisement resources only. MetalLB 0.16 enables the
# FRR-K8s BGP backend by default; keep that unused control plane absent.
frrk8s:
  enabled: false
