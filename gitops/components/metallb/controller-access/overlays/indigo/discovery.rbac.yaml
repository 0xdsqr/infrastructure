apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: indigo-metrics-discovery
rules:
  # Discovery label filters are not an RBAC boundary: this permits listing pod
  # metadata throughout metallb-system, but never reading Secrets or exec/proxy.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: indigo-metrics-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: indigo-metrics-discovery
subjects:
  - kind: ServiceAccount
    name: indigo-metrics
    namespace: observability
