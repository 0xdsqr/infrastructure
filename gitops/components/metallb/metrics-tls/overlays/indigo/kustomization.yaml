apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Owned by external-secrets-config. Vault roles were applied before wiring
# issuance; MetalLB's serving-certificate cutover remains a separate step.
namespace: metallb-system
resources:
  - ../../../../external-secrets-config/common
  - controller.yaml
  - speaker.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: metallb
      platform.dsqr.dev/owner: platform
      platform.dsqr.dev/tier: platform-secret
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production

patches:
  - target:
      kind: ConfigMap
      name: dsqr-home-root-ca
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"
