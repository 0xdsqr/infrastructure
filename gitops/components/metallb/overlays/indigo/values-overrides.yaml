# Indigo runs MetalLB as the sole controller for explicitly classed LoadBalancer Services.
# L2 speakers stay on all six workers, including the reserved platform pool.
loadBalancerClass: metallb.io/metallb

# Issued and verified before this manual-sync serving cutover. The chart mounts
# full Secret directories; controller-runtime reloads renewed certificates.
tls:
  controllerMetricsTLSSecret: metallb-controller-metrics-tls
  speakerMetricsTLSSecret: metallb-speaker-metrics-tls

controller:
  nodeSelector:
    platform.dsqr.dev/node-pool: platform
  tolerations:
    - key: platform.dsqr.dev/dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
  priorityClassName: system-cluster-critical
  securityContext:
    seccompProfile:
      type: RuntimeDefault

speaker:
  tolerations:
    - key: platform.dsqr.dev/dedicated
      operator: Equal
      value: applications
      effect: NoSchedule
    - key: platform.dsqr.dev/dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
  tolerateMaster: false
  priorityClassName: system-node-critical

networkpolicies:
  enabled: true
  defaultDeny: true
  apiPort: 6443
