# Shared default Helm values for the Cilium chart.
# Keep values here when every cluster should use the same networking defaults.
# Put cluster-specific identity, API server addresses, or rollout settings in gitops/components/cilium/overlays/<cluster>/values-overrides.yaml.

ipam:
  mode: kubernetes

kubeProxyReplacement: true

rollOutCiliumPods: true

operator:
  replicas: 1
  # Restart the operator when its shared Cilium ConfigMap changes. The
  # operator owns CRD registration for features such as Gateway API, so it
  # must observe those settings before agents depending on the CRDs roll.
  rollOutPods: true
