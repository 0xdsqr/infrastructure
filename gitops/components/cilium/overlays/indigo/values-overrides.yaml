# Indigo Helm value overrides for Cilium.
# Keep the shared datapath defaults in common.yaml and cluster identity,
# API endpoint, and availability settings here.

cluster:
  name: indigo
  id: 2

k8sServiceHost: 10.10.80.10
k8sServicePort: 6443

bpf:
  masquerade: true
  # Preserve the live Service datapath when retiring Gateway API.
  lbAlgorithmAnnotation: true

socketLB:
  hostNamespaceOnly: true

# Keep Cilium's service datapath on Indigo's LAN interface. Tailscale remains
# available for node administration, but its ts0 interface must not be selected
# for Kubernetes NodePort, masquerading, or datapath MTU detection.
devices: ens18

# Keep endpoint anti-spoofing explicit while integrating Cilium's policy proxy
# with the host firewall. Do not rely on the chart default for this safeguard.
enableSourceIPVerification: true

# Envoy Gateway owns north-south routing. Retain Cilium's separate Envoy
# DaemonSet for Cilium L7 network policy and observability.
l7Proxy: true

envoy:
  enabled: true
  # Preserve the tested Cilium L7 source-address behavior.
  useOriginalSourceAddress: false
  # The Envoy DaemonSet must restart when its shared Cilium configuration
  # changes so this compatibility setting takes effect everywhere.
  rollOutPods: true

gatewayAPI:
  enabled: false

operator:
  replicas: 2

routingMode: tunnel
tunnelProtocol: vxlan

# Hubble CA rotation, stage 1: trust both issuers while retaining the current
# serving identity. Disable Helm's random certificate generation. The legacy
# Secrets must remain until the serving-certificate cutover is verified:
# sync this controller with prune=false (also its generated policy default).
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

hubble:
  tls:
    enabled: true
    auto:
      enabled: false
    server:
      existingSecret: hubble-server-certs

tls:
  caBundle:
    enabled: true
    name: dsqr-hubble-ca-bundle
    key: ca.crt
    useSecret: false
    # Public certificates only. Keep the exposed old CA only for the short
    # transition; remove it after all consumers use the Vault-issued identity.
