apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: indigo-metrics-discovery
rules:
  # API selectors are not an RBAC boundary: this grants pod metadata visibility
  # throughout kube-system, but no Secrets, pod exec/proxy, or write access.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: indigo-metrics-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: indigo-metrics-discovery
subjects:
  - kind: ServiceAccount
    name: indigo-metrics
    namespace: observability
