apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Issuance only: Cilium continues using its old Secret until a staged cutover.
namespace: kube-system
resources:
  - issuer.serviceaccount.yaml
  - issuer.clusterrolebinding.yaml
  - server.externalsecret.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: cilium
      platform.dsqr.dev/owner: platform
      platform.dsqr.dev/tier: platform-secret
