apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hubble-server-issuer-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# Vault uses the presented login JWT for TokenReview, as with Argo's issuers.
# This is a separate issuer identity, never the Cilium agent service account.
subjects:
  - kind: ServiceAccount
    name: hubble-server-issuer
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
