# Reusable provided-certificate profile. Indigo selects these settings directly
# in its cluster override; this file is not an additional active values layer.
# Each cluster must configure and verify its own CA bundle before adoption.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

hubble:
  tls:
    enabled: true
    auto:
      enabled: false
    server:
      existingSecret: dsqr-hubble-server-tls
