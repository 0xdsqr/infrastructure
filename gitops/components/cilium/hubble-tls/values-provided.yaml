# Prepared cutover values, NOT included by any Application yet.
# Gate: issue/verify the replacement certificate, distribute old+new public
# trust to every consumer, then activate this file in the generated inventory.
# Remove the old CA from trust after validating the serving-certificate rollout.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

hubble:
  tls:
    enabled: true
    auto:
      enabled: false
    server:
      existingSecret: dsqr-hubble-server-tls
