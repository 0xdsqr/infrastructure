apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: metrics-server-serving-tls
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: metrics-server-serving-tls
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: metrics-server
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-secret
spec:
  path: pki_int/issue/indigo-metrics-server
  method: POST
  resultType: Data
  parameters:
    common_name: metrics-server.kube-system.svc
    alt_names: metrics-server.kube-system.svc.cluster.local
    ttl: 720h
  provider:
    server: https://vault.service.home.arpa:8200
    caProvider:
      type: ConfigMap
      name: dsqr-home-root-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes-indigo
        role: indigo-metrics-server-issuer
        serviceAccountRef:
          name: metrics-server-issuer
