apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server-issuer-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# Vault uses the presented login JWT for TokenReview. This issuer identity
# is separate from the running Metrics Server service account.
subjects:
  - kind: ServiceAccount
    name: metrics-server-issuer
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
