# Reusable serving-certificate values, mirrored in Indigo's active overlay.
# First issue/verify the Secret, then roll both replicas onto these settings.
# Enable APIService CA verification only after both endpoints serve the new cert.
tls:
  type: existingSecret
  existingSecret:
    name: metrics-server-serving-tls
    # Argo renders offline. Trust will be supplied explicitly, never via lookup.
    lookup: false

# Metrics Server v0.8.1 uses the Kubernetes dynamic serving-certificate loader.
# The chart mounts the Secret as a directory (not subPath), allowing renewal
# without extending Argo's namespace-scoped Reloader permissions to kube-system.
