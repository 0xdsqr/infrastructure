# Indigo deliberately verifies kubelet serving certificates. Before the first Metrics Server
# sync, every kubelet must use a serving certificate issued by the kubeadm cluster CA.
args:
  - --kubelet-certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

# Both endpoints were verified against the Vault-issued certificate before
# enabling APIService verification. The mounted Secret supports native reload.
tls:
  type: existingSecret
  existingSecret:
    name: metrics-server-serving-tls
    lookup: false

# Public trust anchor only, kept identical to dsqr-home-root-ca by tests.
# Argo renders offline: never derive APIService trust using Helm lookup.
apiService:
  insecureSkipTLSVerify: false
  caBundle: |
    -----BEGIN CERTIFICATE-----
    MIIBoTCCAUegAwIBAgIUMeqr/7ZX65uFmlz/stdj1gtfNmAwCgYIKoZIzj0EAwIw
