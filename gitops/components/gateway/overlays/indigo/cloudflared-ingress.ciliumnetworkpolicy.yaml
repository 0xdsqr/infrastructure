apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-shared-cloudflared-ingress
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-ingress
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: shared
      gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-system
            k8s:io.cilium.k8s.policy.serviceaccount: cloudflared
            app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
