apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-shared-dmz-ingress
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-ingress
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: shared
      gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    # The Local LoadBalancer policy preserves the Caddy/cloudflared host IP.
    - fromCIDR: [10.10.60.100/32]
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
