apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway-system

resources:
  - ../../base

labels:
  - pairs:
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: shared
    patch: |-
      - op: add
        path: /spec/infrastructure/annotations/metallb.io~1loadBalancerIPs
        value: 10.10.80.200
