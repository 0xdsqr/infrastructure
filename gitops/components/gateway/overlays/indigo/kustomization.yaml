apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production

patches:
  - target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyProxy
      name: shared
    patch: |-
      - op: add
        path: /spec/provider/kubernetes/envoyService/annotations/metallb.io~1loadBalancerIPs
        value: 10.10.80.200
