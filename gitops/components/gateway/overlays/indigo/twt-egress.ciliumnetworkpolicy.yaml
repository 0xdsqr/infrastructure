apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-shared-to-twt
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tastingswithtay
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: shared
      gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: twt
            k8s:io.cilium.k8s.policy.serviceaccount: twt-web
            app.kubernetes.io/instance: twt-web
            app.kubernetes.io/name: twt-app
      toPorts:
        - ports: [{port: "3010", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: twt
            k8s:io.cilium.k8s.policy.serviceaccount: twt-admin
            app.kubernetes.io/instance: twt-admin
            app.kubernetes.io/name: twt-app
      toPorts:
        - ports: [{port: "3011", protocol: TCP}]
