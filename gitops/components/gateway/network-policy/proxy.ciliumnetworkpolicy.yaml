apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-shared-proxy-access
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-ingress
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: shared
      gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "19002"
              protocol: TCP
            - port: "19003"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: k8s-monitoring-alloy-metrics
            app.kubernetes.io/name: alloy-metrics
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/instance: envoy-gateway
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
