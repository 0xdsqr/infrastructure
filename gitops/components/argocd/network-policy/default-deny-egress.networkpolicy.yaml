apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-default-deny-egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: argocd
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  # Cover new pods as well as current Argo roles. The chart owns ingress policy;
  # the companion Cilium policies explicitly allow each role's required egress.
  podSelector: {}
  policyTypes: [Egress]
