apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-kubernetes-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: argocd
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argocd
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [argocd-application-controller, argocd-applicationset-controller, argocd-server, argocd-redis-secret-init]
  enableDefaultDeny:
    ingress: false
    egress: false
  # Repo-server and Redis do not need Kubernetes API access.
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
