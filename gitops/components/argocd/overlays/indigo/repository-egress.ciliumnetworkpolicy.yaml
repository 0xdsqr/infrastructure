apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repository-downloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: argocd
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: argocd
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [argocd-repo-server]
  enableDefaultDeny:
    ingress: false
    egress: false
  # Indigo's configured Git/Helm registries; download redirects are listed explicitly.
  # Future repository additions must extend this overlay and its connectivity tests.
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudflare.docker.com
        - matchName: helm.cilium.io
        - matchName: charts.external-secrets.io
        - matchName: kubernetes-sigs.github.io
        - matchName: metallb.github.io
        - matchName: postfinance.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
