# Indigo Helm value overrides for the bootstrap Argo CD release.
global:
  domain: argocd.indigo.home.arpa

configs:
  cm:
    webhook.maxPayloadSizeMB: "5"
  secret:
    githubSecret: "$argocd-github-webhook:secret"

server:
  # Indigo uses the separately managed Cilium Gateway API routes; never render
  # the chart's legacy Ingress resource.
  ingress:
    enabled: false
