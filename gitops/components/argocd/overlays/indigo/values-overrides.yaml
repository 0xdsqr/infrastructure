# Indigo Helm value overrides for the bootstrap Argo CD release.
global:
  domain: argocd.indigo.home.arpa

applicationSet:
  replicas: 1
  extraArgs:
    - --policy=create-update
    - --enable-scm-providers=false
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

configs:
  cm:
    webhook.maxPayloadSizeMB: "5"
  secret:
    githubSecret: "$argocd-github-webhook:secret"

server:
  # Indigo uses the separately managed Envoy Gateway API routes; never render
  # the chart's legacy Ingress resource.
  ingress:
    enabled: false
