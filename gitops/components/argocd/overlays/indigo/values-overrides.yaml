# Indigo Helm value overrides for the bootstrap Argo CD release.
global:
  domain: argocd.indigo.home.arpa

redis:
  # Redis only serves Argo's cache; it does not call the Kubernetes API.
  automountServiceAccountToken: false

redis-ha:
  enabled: true

applicationSet:
  replicas: 1
  deploymentAnnotations:
    configmap.reloader.stakater.com/reload: dsqr-home-root-ca
  extraEnv:
    - name: ARGOCD_APP_CONF_PATH
      value: /app/dsqr-tls
  extraVolumes:
    - name: dsqr-repo-ca
      configMap:
        name: dsqr-home-root-ca
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: dsqr-repo-ca
      mountPath: /app/dsqr-tls/reposerver/tls
      readOnly: true
  extraArgs:
    - --policy=create-update
    - --enable-scm-providers=false
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

configs:
  params:
    # Migration stage 1: start HA without cutting clients over. Sync WITHOUT
    # pruning so the existing argocd-redis Deployment/Service remain available.
    # Remove this override only after HA readiness, auth and quorum validation;
    # roll clients, then explicitly retire the old standalone resources.
    redis.server: argocd-redis:6379
    # Envoy verifies the Vault-issued argocd-server-tls certificate.
    server.insecure: "false"
    repo.server: argocd-repo-server.argocd.svc.cluster.local:8081
    reposerver.disable.tls: "false"
    # All repo-server clients authenticate its Vault-issued service identity.
    server.repo.server.strict.tls: "true"
    controller.repo.server.strict.tls: "true"
    applicationsetcontroller.repo.server.strict.tls: "true"
    server.repo.server.plaintext: "false"
    controller.repo.server.plaintext: "false"
    applicationsetcontroller.repo.server.plaintext: "false"
  cm:
    users.anonymous.enabled: "false"
    webhook.maxPayloadSizeMB: "5"
  secret:
    githubSecret: "$argocd-github-webhook:secret"

server:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  # Use built-in node identity; custom worker pools are a separate rollout.
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  deploymentAnnotations:
    configmap.reloader.stakater.com/reload: dsqr-home-root-ca
  env:
    - name: ARGOCD_APP_CONF_PATH
      value: /app/dsqr-tls
  volumes:
    - name: dsqr-repo-ca
      configMap:
        name: dsqr-home-root-ca
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: dsqr-repo-ca
      mountPath: /app/dsqr-tls/server/tls
      readOnly: true
  # Indigo uses the separately managed Envoy Gateway API routes; never render
  # the chart's legacy Ingress resource.
  ingress:
    enabled: false

controller:
  statefulsetAnnotations:
    configmap.reloader.stakater.com/reload: dsqr-home-root-ca
  env:
    - name: ARGOCD_APP_CONF_PATH
      value: /app/dsqr-tls
  volumes:
    - name: dsqr-repo-ca
      configMap:
        name: dsqr-home-root-ca
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: dsqr-repo-ca
      mountPath: /app/dsqr-tls/controller/tls
      readOnly: true

repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
  # Repository rendering uses credentials supplied by Argo, not the Kubernetes API.
  automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: argocd-repo-server-serving-tls
  env:
    - name: ARGOCD_APP_CONF_PATH
      value: /app/dsqr-tls
  volumes:
    - name: dsqr-repo-serving-tls
      secret:
        secretName: argocd-repo-server-serving-tls
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
  volumeMounts:
    - name: dsqr-repo-serving-tls
      mountPath: /app/dsqr-tls/reposerver/tls
      readOnly: true
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
