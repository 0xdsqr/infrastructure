apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: argocd-server-backend-tls
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: argocd
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-policy
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: argocd-server
      sectionName: https
  validation:
    hostname: argocd-server.argocd.svc.cluster.local
    # The certificate component owns this public CA ConfigMap in argocd.
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: dsqr-home-root-ca
