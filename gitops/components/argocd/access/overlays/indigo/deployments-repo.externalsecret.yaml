apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-deployments-repo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: argocd-deployments-repo
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: argocd
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: vault-indigo
    kind: ClusterSecretStore
  target:
    name: argocd-deployments-repo
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: argocd-deployments-repo
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: argocd
          argocd.argoproj.io/secret-type: repository
          platform.dsqr.dev/cluster: indigo
          platform.dsqr.dev/owner: platform
          platform.dsqr.dev/tier: platform-secret
  data:
    - secretKey: type
      remoteRef:
        key: dsqr-labs/clusters/indigo/platform/argocd/repos/deployments
        property: type
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: url
      remoteRef:
        key: dsqr-labs/clusters/indigo/platform/argocd/repos/deployments
        property: url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppID
      remoteRef:
        key: dsqr-labs/clusters/indigo/platform/argocd/repos/deployments
        property: githubAppID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: dsqr-labs/clusters/indigo/platform/argocd/repos/deployments
        property: githubAppInstallationID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: dsqr-labs/clusters/indigo/platform/argocd/repos/deployments
        property: githubAppPrivateKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
