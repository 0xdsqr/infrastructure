apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources explicitly name their namespaces: the backend egress policy lives
# beside Envoy, while the routes, Secret and ingress policy live beside Argo.
resources:
  - ../../base
  - github-webhook.externalsecret.yaml
  - ui.httproute.yaml
  - github-webhook.httproute.yaml

labels:
  - pairs:
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production
