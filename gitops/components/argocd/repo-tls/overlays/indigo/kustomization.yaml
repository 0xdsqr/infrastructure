apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - repo-server.vaultdynamicsecret.yaml

labels:
  - pairs:
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production

patches:
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: argocd-repo-server-serving-tls
    patch: |-
      - op: add
        path: /spec/target/template/metadata/labels/platform.dsqr.dev~1cluster
        value: indigo
