apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-repo-server-issuer-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# Vault reviews the login JWT using the dedicated issuer identity, not the
# repo-server workload's service account.
subjects:
  - kind: ServiceAccount
    name: argocd-repo-server-issuer
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
