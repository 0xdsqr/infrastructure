apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-server-issuer-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
# Vault's existing Kubernetes auth setup reviews the login JWT using the
# issuer identity. Do not grant this role to argocd-server's own account.
subjects:
  - kind: ServiceAccount
    name: argocd-server-issuer
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
