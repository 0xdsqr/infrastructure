apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Certificate preparation only: enabling server TLS and switching routes are
# separate rollout steps. Reuse the platform's public root CA without copying it.
namespace: argocd
resources:
  - ../../../external-secrets-config/common
  - issuer.serviceaccount.yaml
  - issuer.clusterrolebinding.yaml
  - server.externalsecret.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: dsqr-home-root-ca
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: argocd
      platform.dsqr.dev/owner: platform
      platform.dsqr.dev/tier: platform-secret
