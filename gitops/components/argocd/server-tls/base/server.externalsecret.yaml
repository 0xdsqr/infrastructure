apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-server-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshPolicy: Periodic
  # Reissue every 10 days, ahead of the overlay's 30-day certificate expiry.
  refreshInterval: 240h
  target:
    name: argocd-server-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      metadata:
        labels:
          app.kubernetes.io/name: argocd-server-tls
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: argocd
          platform.dsqr.dev/owner: platform
          platform.dsqr.dev/tier: platform-secret
      data:
        tls.crt: |
          {{ .certificate }}
          {{ .issuing_ca }}
        tls.key: |
          {{ .private_key }}
        ca.crt: |
          {{ .issuing_ca }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: argocd-server-tls
