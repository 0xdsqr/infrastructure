apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-gateway-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: platform-gateway-api
    app.kubernetes.io/part-of: dsqr-gitops
    platform.dsqr.dev/tier: platform
spec:
  description: Pinned Kubernetes Gateway API Standard Channel definitions
  sourceRepos:
    - https://github.com/kubernetes-sigs/gateway-api.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
      name: safe-upgrades.gateway.networking.k8s.io
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
      name: safe-upgrades.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: backendtlspolicies.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: gatewayclasses.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: gateways.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: grpcroutes.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: httproutes.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: listenersets.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: referencegrants.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: tcproutes.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: tlsroutes.gateway.networking.k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: udproutes.gateway.networking.k8s.io
  namespaceResourceWhitelist: []
