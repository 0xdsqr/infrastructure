# Shared default Helm values for the Argo CD chart.
# Keep values here when every cluster should use the same Argo CD defaults.
# Put cluster-specific changes in gitops/components/argocd/overlays/<cluster>/values-overrides.yaml.
dsqr:
  # Legacy ingress is opt-in; new clusters declare their own Gateway routes.
  legacyTraefikIngress: false

global:
  addPrometheusAnnotations: false
  networkPolicy:
    # The chart's server policy permits every ingress source and its metrics
    # rules permit every namespace. Explicit policies below define each flow.
    create: false
    defaultDenyIngress: false

configs:
  cm:
    # Keep the local admin account until SSO and an offline break-glass path
    # have both been configured and exercised.
    admin.enabled: "true"
    timeout.reconciliation: 120s
    timeout.reconciliation.jitter: 60s
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for child Application status"
      if obj.status == nil then
        return hs
      end
      if obj.status.health ~= nil and obj.status.health.status == "Degraded" then
        hs.status = "Degraded"
        hs.message = obj.status.health.message or "Child Application is degraded"
        return hs
      end
      if obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
        local syncStatus = "Unknown"
        if obj.status.sync ~= nil and obj.status.sync.status ~= nil then
          syncStatus = obj.status.sync.status
        end
        hs.message = "Waiting for child Application sync (" .. syncStatus .. ")"
        return hs
      end
      if obj.status.health ~= nil and obj.status.health.status == "Healthy" then
        hs.status = "Healthy"
        hs.message = obj.status.health.message or "Child Application is synced and healthy"
        return hs
      end
      hs.message = "Waiting for child Application health"
      if obj.status.health ~= nil and obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
      return hs
  params:
    server.insecure: "true"

crds:
  install: true
  keep: true

controller:
  metrics:
    enabled: true
    service:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portName: http-metrics
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    create: false

dex:
  # No SSO connector is configured yet. Do not run an unused identity service.
  enabled: false

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  networkPolicy:
    create: false

redisSecretInit:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Opt-in HA profile, using the Redis/Sentinel subchart bundled with Argo CD.
# Three schedulable nodes are required. Redis is a disposable cache, not storage.
redis-ha:
  enabled: false
  replicas: 3
  hardAntiAffinity: true
  auth: true
  existingSecret: argocd-redis
  authKey: auth
  persistentVolume:
    enabled: false
  serviceAccount:
    automountToken: false
  rbac:
    create: false
  podDisruptionBudget:
    minAvailable: 2
  init:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  redis:
    updateStrategy:
      type: RollingUpdate
    terminationGracePeriodSeconds: 60
    lifecycle:
      preStop:
        exec:
          command:
            - /bin/sh
            - -ec
            - |
              # Bundled redis-ha 4.38.0 omits SENTINELAUTH from this container.
              # This profile intentionally uses the same Secret/key for both.
              export SENTINELAUTH="${AUTH:?Redis authentication is required}"
              exec timeout 35 /bin/sh /readonly-config/trigger-failover-if-master.sh
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {memory: 512Mi}
    config:
      save: '""'
      # Leave headroom for replication buffers and Redis process overhead.
      maxmemory: 256mb
  sentinel:
    quorum: 2
    auth: true
    existingSecret: argocd-redis
    authKey: auth
    # Ordinary containers terminate concurrently. Keep the local Sentinel alive
    # beyond Redis's bounded 35s preStop, within the pod's 60s grace period.
    lifecycle:
      preStop:
        exec:
          command: [/bin/sh, -ec, "sleep 40"]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  splitBrainDetection:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  haproxy:
    enabled: true
    replicas: 2
    hardAntiAffinity: true
    serviceAccount:
      automountToken: false
    podDisruptionBudget:
      minAvailable: 1
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    init:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    # Use the scoped policies below, not the subchart's all-namespace DNS rule.
    networkPolicy:
      enabled: false
  networkPolicy:
    enabled: false

repoServer:
  metrics:
    enabled: true
    service:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portName: http-metrics
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  networkPolicy:
    create: false

server:
  metrics:
    enabled: true
    service:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portName: http-metrics
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  networkPolicy:
    create: false
  ingress:
    enabled: false
    ingressClassName: traefik
    path: /
    pathType: Prefix
    tls: false

applicationSet:
  # Cluster overlays opt in when Applications are managed by ApplicationSets.
  replicas: 0
  metrics:
    enabled: false
  networkPolicy:
    create: false

notifications:
  # Re-enable with a concrete notifier and alert-routing policy.
  enabled: false

extraObjects:
  # HA backend policies are chart-owned and only render when HA is enabled.
  # Ordinary NetworkPolicies and our Cilium client policies are additive.
  - |
    {{- if (index .Values "redis-ha").enabled }}
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-redis-ha-backend
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels: {release: {{ .Release.Name }}, app: redis-ha}
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels: {release: {{ .Release.Name }}, app: redis-ha}
            - podSelector:
                matchLabels: {release: {{ .Release.Name }}, app: redis-ha-haproxy}
          ports:
            - {port: 6379, protocol: TCP}
            - {port: 26379, protocol: TCP}
      egress:
        - to:
            - podSelector:
                matchLabels: {release: {{ .Release.Name }}, app: redis-ha}
          ports:
            - {port: 6379, protocol: TCP}
            - {port: 26379, protocol: TCP}
        - to:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: kube-system}
              podSelector:
                matchLabels: {k8s-app: kube-dns}
          ports:
            - {port: 53, protocol: UDP}
            - {port: 53, protocol: TCP}
    {{- end }}
  - |
    {{- if (index .Values "redis-ha").enabled }}
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-redis-ha-proxy
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels: {release: {{ .Release.Name }}, app: redis-ha-haproxy}
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [argocd-application-controller, argocd-server, argocd-repo-server]
          ports:
            - {port: 6379, protocol: TCP}
      egress:
        - to:
            - podSelector:
                matchLabels: {release: {{ .Release.Name }}, app: redis-ha}
          ports:
            - {port: 6379, protocol: TCP}
            - {port: 26379, protocol: TCP}
        - to:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: kube-system}
              podSelector:
                matchLabels: {k8s-app: kube-dns}
          ports:
            - {port: 53, protocol: UDP}
            - {port: 53, protocol: TCP}
    {{- end }}
  - |
    {{- if (index .Values "redis-ha").enabled }}
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-redis-ha-clients
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
        matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values: [argocd-application-controller, argocd-server, argocd-repo-server]
      policyTypes: [Egress]
      egress:
        - to:
            - podSelector:
                matchLabels: {release: {{ .Release.Name }}, app: redis-ha-haproxy}
          ports:
            - {port: 6379, protocol: TCP}
    {{- end }}
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-default-deny-ingress
      namespace: argocd
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
  # The upstream chart evaluates string extraObjects with Helm's tpl function.
  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-allow-server-ingress
      namespace: argocd
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: argocd
          app.kubernetes.io/name: argocd-server
      policyTypes:
        - Ingress
      ingress:
        {{- if .Values.dsqr.legacyTraefikIngress }}
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: traefik
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: traefik-traefik
                  app.kubernetes.io/name: traefik
          ports:
            - port: 8080
              protocol: TCP
        {{- end }}
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: k8s-monitoring-alloy-metrics
                  app.kubernetes.io/name: alloy-metrics
          ports:
            - port: 8083
              protocol: TCP
  - |
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-allow-repo-server-ingress
      namespace: argocd
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: argocd
          app.kubernetes.io/name: argocd-repo-server
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
                  app.kubernetes.io/name: argocd-application-controller
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
                  app.kubernetes.io/name: argocd-server
            {{- if gt (int .Values.applicationSet.replicas) 0 }}
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
                  app.kubernetes.io/name: argocd-applicationset-controller
            {{- end }}
          ports:
            - port: 8081
              protocol: TCP
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: k8s-monitoring-alloy-metrics
                  app.kubernetes.io/name: alloy-metrics
          ports:
            - port: 8084
              protocol: TCP
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-allow-controller-metrics
      namespace: argocd
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: argocd
          app.kubernetes.io/name: argocd-application-controller
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: observability
              podSelector:
                matchLabels:
                  app.kubernetes.io/instance: k8s-monitoring-alloy-metrics
                  app.kubernetes.io/name: alloy-metrics
          ports:
            - port: 8082
              protocol: TCP
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-allow-redis
      namespace: argocd
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: argocd
          app.kubernetes.io/name: argocd-redis
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
                  app.kubernetes.io/name: argocd-application-controller
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
                  app.kubernetes.io/name: argocd-repo-server
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: argocd
                  app.kubernetes.io/name: argocd-server
          ports:
            - port: 6379
              protocol: TCP
