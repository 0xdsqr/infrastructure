apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: indigo-metrics-hosts
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: indigo-metrics
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
    # Cluster nodes use Cilium host identities, not external CIDR identities.
    # This does not require a cluster-wide nodeSelectorLabels setting change.
    # TLS and nodes/metrics RBAC additionally limit access to the explicit inventory.
    - toEntities: [host, remote-node, kube-apiserver]
      toPorts:
        - ports: [{port: "10250", protocol: TCP}]
    # Speakers use worker host identities. This grants node-identity egress on
    # one port, not arbitrary Internet access or collector-only host ingress.
    # NixOS limits source pools; TLS + delegated RBAC authenticate the caller.
    - toEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "9120", protocol: TCP}]
