apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: indigo-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: indigo-metrics
  policyTypes: [Ingress, Egress]
  ingress:
    # Alloy peer membership and scrape assignment; no public UI or receiver.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: indigo-metrics
      ports: [{protocol: TCP, port: 12345}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: indigo-metrics
      ports: [{protocol: TCP, port: 12345}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: kube-state-metrics
      ports: [{protocol: TCP, port: 8080}]
    # Named pod ports prevent granting Argo UI/RPC access alongside metrics.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: argocd}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [argocd-application-controller, argocd-applicationset-controller, argocd-server, argocd-repo-server]
      ports: [{protocol: TCP, port: metrics}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {release: argocd, app: redis-ha-haproxy}
      ports: [{protocol: TCP, port: 9101}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: reloader, app.kubernetes.io/name: reloader}
      ports: [{protocol: TCP, port: 9090}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: external-secrets}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: external-secrets}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [external-secrets, external-secrets-cert-controller, external-secrets-webhook]
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: envoy-gateway
              app.kubernetes.io/name: gateway-helm
              control-plane: envoy-gateway
      ports: [{protocol: TCP, port: 19001}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
              gateway.envoyproxy.io/owning-gateway-name: shared
              gateway.envoyproxy.io/owning-gateway-namespace: gateway-system
      ports: [{protocol: TCP, port: 19001}]
    - to:
        - ipBlock: {cidr: 10.10.30.102/32}
      ports: [{protocol: TCP, port: 9443}]
