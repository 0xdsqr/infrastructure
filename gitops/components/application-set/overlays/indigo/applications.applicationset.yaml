apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # Privilege-bearing fields are declared here, in public infrastructure.
                # This private generator contributes only the immutable source revision;
                # its separate values source is constrained by the public chart and project.
                - name: dotdev-web
                  cluster: indigo
                  environment: production
                  lifecycle: controller
                  retryProfile: standard
          - git:
              repoURL: https://github.com/dsqr-labs/deployments.git
              revision: refs/heads/master
              files:
                - path: apps/dotdev-web/environments/production/release.yaml
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "6"
      labels:
        app.kubernetes.io/name: '{{ .name }}'
        app.kubernetes.io/instance: '{{ .name }}'
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: dsqr-dotdev
        platform.dsqr.dev/owner: dsqr
        platform.dsqr.dev/tier: application
        platform.dsqr.dev/lifecycle: '{{ .lifecycle }}'
        platform.dsqr.dev/cluster: '{{ .cluster }}'
        platform.dsqr.dev/environment: '{{ .environment }}'
    spec:
      project: dsqr
      destination:
        server: https://kubernetes.default.svc
        namespace: dsqr
      sources:
        - repoURL: https://github.com/0xdsqr/dsqr-dotdev.git
          targetRevision: '{{ .sourceRevision }}'
          path: helm/dsqr-app
          helm:
            releaseName: '{{ .name }}'
            valueFiles:
              - values-dotdev.yaml
              - $values/apps/dotdev-web/environments/production/values.yaml
        - repoURL: https://github.com/dsqr-labs/deployments.git
          targetRevision: refs/heads/master
          ref: values
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          enabled: false
          selfHeal: false
          prune: false
          allowEmpty: false
        retry:
          limit: 3
          refresh: true
          backoff:
            duration: 20s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - FailOnSharedResource=true
          - PruneLast=true
