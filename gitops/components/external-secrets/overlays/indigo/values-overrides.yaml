# Indigo Helm value overrides for External Secrets Operator.
# Keep Vault connectivity and secret resources in external-secrets-config.
replicaCount: 2
leaderElect: true

# Namespace-local discovery only; never grant the collector Secret access.
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: indigo-metrics-discovery
      namespace: external-secrets
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: indigo-metrics-discovery
      namespace: external-secrets
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: indigo-metrics-discovery
    subjects:
      - kind: ServiceAccount
        name: indigo-metrics
        namespace: observability

# The chart supplies a different label selector for each of its three components.
# Two healthy replicas must span two eligible nodes, including during maintenance.
global:
  nodeSelector:
    platform.dsqr.dev/node-pool: platform
  tolerations:
    - key: platform.dsqr.dev/dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor

podDisruptionBudget:
  enabled: true
  minAvailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate: {maxSurge: 1, maxUnavailable: 0}

webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}

certController:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
