# Indigo Helm value overrides for External Secrets Operator.
# Keep Vault connectivity and secret resources in external-secrets-config.
replicaCount: 2
leaderElect: true

# The chart supplies a different label selector for each of its three components.
# Two healthy replicas must span two eligible nodes, including during maintenance.
global:
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor

podDisruptionBudget:
  enabled: true
  minAvailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate: {maxSurge: 1, maxUnavailable: 0}

webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}

certController:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
