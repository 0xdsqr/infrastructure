apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: telemetry-client-tls
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: telemetry-client-tls
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-observability
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-secret
spec:
  path: pki_int/issue/indigo-telemetry-client
  method: POST
  resultType: Data
  parameters:
    common_name: indigo.telemetry-client.home.arpa
    ttl: 720h
  provider:
    server: https://vault.service.home.arpa:8200
    caProvider:
      type: ConfigMap
      name: dsqr-home-root-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes-indigo
        role: indigo-telemetry-client-issuer
        serviceAccountRef:
          name: telemetry-client-issuer
