apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telemetry-client-tls
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshPolicy: Periodic
  # Reissue every 10 days, ahead of the overlay's 30-day certificate expiry.
  refreshInterval: 240h
  target:
    name: telemetry-client-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      metadata:
        labels:
          app.kubernetes.io/name: telemetry-client-tls
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: cluster-observability
          platform.dsqr.dev/owner: platform
          platform.dsqr.dev/tier: platform-secret
      # Peer verification uses the independently managed dsqr-home-root-ca
      # ConfigMap, not a CA bundled with the client private key.
      data:
        tls.crt: |
          {{ .certificate }}
          {{ .issuing_ca }}
        tls.key: |
          {{ .private_key }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: telemetry-client-tls
