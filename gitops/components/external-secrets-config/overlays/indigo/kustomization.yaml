apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../common
  - vault-indigo.clustersecretstore.yaml
  - indigo-bootstrap-smoke-test.externalsecret.yaml
  - gateway-origin-issuer.serviceaccount.yaml
  - gateway-origin-issuer.clusterrolebinding.yaml
  - gateway-root-ca.configmap.yaml
  - indigo-gateway-origin.vaultdynamicsecret.yaml
  - indigo-gateway-origin.externalsecret.yaml
  - vault-access.ciliumnetworkpolicy.yaml

components:
  - ../../network-policy

patches:
  - target:
      group: cilium.io
      kind: CiliumNetworkPolicy
      name: external-secrets-webhook-access
    patch: |-
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: external-secrets-webhook-access
      spec:
        ingress:
          # Host-originated API requests use Cilium's node-router address and
          # arrive as remote-node on Indigo's VXLAN datapath (verified in Hubble).
          # Permit nodes only on the webhook port, never all cluster workloads.
          - fromEntities: [kube-apiserver, remote-node]
            toPorts:
              - ports:
                  - port: "10250"
                    protocol: TCP

labels:
  - pairs:
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production
