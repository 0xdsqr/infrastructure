apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dotdev-web
  namespace: dsqr
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: vault-indigo
    kind: ClusterSecretStore
  target:
    name: dotdev-web
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: dsqr-labs/clusters/indigo/apps/dotdev-web
        property: DATABASE_URL
