apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: twt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: vault-indigo
    kind: ClusterSecretStore
  target:
    name: ghcr-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ dict "auths" (dict .server (dict "username" .username "password" .password "email" .email "auth" (printf "%s:%s" .username .password | b64enc))) | toJson }}
  data:
    - secretKey: server
      remoteRef: {key: dsqr-labs/clusters/indigo/platform/ghcr-pull, property: server}
    - secretKey: username
      remoteRef: {key: dsqr-labs/clusters/indigo/platform/ghcr-pull, property: username}
    - secretKey: password
      remoteRef: {key: dsqr-labs/clusters/indigo/platform/ghcr-pull, property: password}
    - secretKey: email
      remoteRef: {key: dsqr-labs/clusters/indigo/platform/ghcr-pull, property: email}
