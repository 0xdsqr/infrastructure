apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indigo-bootstrap-smoke-test
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: indigo-bootstrap-smoke-test
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-secrets
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: bootstrap-validation
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: vault-indigo
    kind: ClusterSecretStore
  target:
    name: indigo-bootstrap-smoke-test
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: indigo-bootstrap-smoke-test
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: cluster-secrets
          platform.dsqr.dev/owner: platform
          platform.dsqr.dev/tier: bootstrap-validation
  data:
    - secretKey: message
      remoteRef:
        key: dsqr-labs/clusters/indigo/bootstrap/eso-smoke-test
        property: message
