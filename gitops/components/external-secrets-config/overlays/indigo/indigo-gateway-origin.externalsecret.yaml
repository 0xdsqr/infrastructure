apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indigo-gateway-origin
  namespace: gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: indigo-gateway-origin
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: cluster-ingress
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/tier: platform-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 240h
  target:
    name: gateway-origin-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      metadata:
        labels:
          app.kubernetes.io/name: gateway-origin-tls
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: cluster-ingress
          platform.dsqr.dev/cluster: indigo
          platform.dsqr.dev/owner: platform
          platform.dsqr.dev/tier: platform-secret
      data:
        tls.crt: |
          {{ .certificate }}
          {{ .issuing_ca }}
        tls.key: |
          {{ .private_key }}
        ca.crt: |
          {{ .issuing_ca }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: indigo-gateway-origin
