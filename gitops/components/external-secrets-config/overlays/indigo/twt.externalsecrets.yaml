apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twt-web-secrets
  namespace: twt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: vault-indigo
    kind: ClusterSecretStore
  target:
    name: twt-web-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTH_SECRET
      remoteRef: {key: dsqr-labs/clusters/indigo/apps/twt-web, property: AUTH_SECRET}
    - secretKey: DATABASE_URL
      remoteRef: {key: dsqr-labs/clusters/indigo/apps/twt-web, property: DATABASE_URL}
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef: {key: dsqr-labs/clusters/indigo/apps/twt-web, property: DISCORD_CLIENT_SECRET}
    - secretKey: S3_ACCESS_KEY
      remoteRef: {key: dsqr-labs/clusters/indigo/apps/twt-web, property: S3_ACCESS_KEY}
    - secretKey: S3_SECRET_KEY
      remoteRef: {key: dsqr-labs/clusters/indigo/apps/twt-web, property: S3_SECRET_KEY}
---
