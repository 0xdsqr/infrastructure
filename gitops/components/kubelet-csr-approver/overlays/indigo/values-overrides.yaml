# Indigo's short node names are not resolvable in cluster DNS, so DNS lookup is
# skipped. Approval remains restricted by the exact hostname pattern, node
# identity checks, and an allowlist containing only Indigo's six node IPs.
providerRegex: "^srv-lx-k8s-indigo-(control|worker)-0[1-3]$"
providerIpPrefixes:
  - 10.10.80.100/32
  - 10.10.80.101/32
  - 10.10.80.102/32
  - 10.10.80.103/32
  - 10.10.80.104/32
  - 10.10.80.105/32
maxExpirationSeconds: "31536000"
bypassDnsResolution: true
bypassHostnameCheck: false
allowedDnsNames: 1
ignoreNonSystemNode: false
skipDenyStep: false

# Retain leader election and approval checks; keep the two replicas on
# different nodes, including across node maintenance and rescheduling.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kubelet-csr-approver
            app.kubernetes.io/instance: kubelet-csr-approver

# The pinned chart exposes extraObjects rather than a dedicated PDB option.
extraObjects:
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: kubelet-csr-approver
      namespace: kube-system
    spec:
      minAvailable: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: kubelet-csr-approver
          app.kubernetes.io/instance: kubelet-csr-approver
