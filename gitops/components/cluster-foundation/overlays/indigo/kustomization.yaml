apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml

# Only the disruption budget is GitOps-owned; kubeadm owns CoreDNS itself.
components:
  - ../../coredns-availability

labels:
  - pairs:
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/environment: production
