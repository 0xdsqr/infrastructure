apiVersion: v1
kind: Namespace
metadata:
  name: twt
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=confirm,Delete=confirm
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: tastingswithtay
    platform.dsqr.dev/owner: twt
    platform.dsqr.dev/tier: application
    platform.dsqr.dev/gateway-access: shared
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: twt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
