fullnameOverride: reloader
image:
  repository: ghcr.io/stakater/reloader
  tag: v1.4.22
reloader:
  watchGlobally: false
  autoReloadAll: false
  reloadStrategy: annotations
  resourceLabelSelector: platform.dsqr.dev/tls-reload=true
  syncAfterRestart: true
  ignoreJobs: true
  ignoreCronJobs: true
  # Upstream syncAfterRestart requires reloadOnCreate. Reconcile enrolled
  # workloads on startup as well, covering renewals missed during downtime.
  reloadOnCreate: true
  reloadOnDelete: false
  readOnlyRootFileSystem: true
  # Companion manifests restrict mutation to the enrolled Argo workloads.
  rbac:
    enabled: false
  serviceAccount:
    create: true
    name: reloader
  deployment:
    replicas: 1
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
