# Namespace-local active/standby controller. Pause the old non-electing singleton
# through a GitOps revision before the initial HA sync; later rolls use election.
reloader:
  enableHA: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  deployment:
    nodeSelector:
      platform.dsqr.dev/node-pool: platform
    tolerations:
      - key: platform.dsqr.dev/dedicated
        operator: Equal
        value: platform
        effect: NoSchedule
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app: reloader
            release: reloader
