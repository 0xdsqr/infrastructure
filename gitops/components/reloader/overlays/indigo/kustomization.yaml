apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ../../base
patches:
  - path: reloader-leader-election.patch.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: reloader
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: platform-renewal
      platform.dsqr.dev/cluster: indigo
      platform.dsqr.dev/owner: platform
