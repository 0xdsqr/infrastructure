      helm:
        releaseName: envoy-gateway-crds
        parameters:
          - name: crds.gatewayAPI.enabled
            value: "false"
          - name: crds.envoyGateway.enabled
            value: "true"
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.1
      helm:
        releaseName: envoy-gateway
        skipCrds: true
        valueFiles:
