# Generated by `nix run .#gitops-generate`.
# Prefer cluster-specific overrides as Kustomize patches in this directory's kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/instance: cilium
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: cluster-networking
    app.kubernetes.io/version: 1.19.6
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/lifecycle: controller
    platform.dsqr.dev/tier: platform-addon
spec:
  project: platform-cilium
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.19.6
      helm:
        releaseName: cilium
        valueFiles:
          - $values/gitops/components/cilium/base/values-common.yaml
          - $values/gitops/components/cilium/overlays/indigo/values-overrides.yaml
    - repoURL: https://github.com/0xdsqr/infrastructure.git
      targetRevision: refs/heads/master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    # Cilium renders these Helm-generated certs non-idempotently, so the
    # desired Secret data changes on render even when live Cilium is healthy.
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    retry:
      limit: 3
      refresh: true
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
