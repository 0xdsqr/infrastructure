# Generated by `nix run .#gitops-generate`.
# Bootstrap installs the same pinned chart; this Application owns day-two changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: argocd
    platform.dsqr.dev/owner: platform
    platform.dsqr.dev/lifecycle: controller
    platform.dsqr.dev/tier: gitops
spec:
  project: platform-argocd
  sources:
    - repoURL: ghcr.io/argoproj/argo-helm
      chart: argo-cd
      targetRevision: 10.2.1
      helm:
        releaseName: argocd
        valueFiles:
          - $values/gitops/components/argocd/base/values-common.yaml
          - $values/gitops/components/argocd/overlays/indigo/values-overrides.yaml
    - repoURL: https://github.com/0xdsqr/infrastructure.git
      targetRevision: refs/heads/master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    retry:
      limit: 3
      refresh: true
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - FailOnSharedResource=true
      - DisableClientSideApplyMigration=true
      - ServerSideApply=true
