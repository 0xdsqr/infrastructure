apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-a
  namespace: argocd
  labels:
    app.kubernetes.io/name: hub-a
    app.kubernetes.io/part-of: dsqr-gitops
    platform.dsqr.dev/cluster: hub-a
    platform.dsqr.dev/environment: lab
    platform.dsqr.dev/physical-host: dell-r730xd
    platform.dsqr.dev/tier: gitops
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/0xdsqr/infrastructure.git
    targetRevision: refs/heads/master
    path: gitops/clusters/hub-a/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
