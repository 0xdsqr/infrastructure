apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-foundation.yaml
  - argocd-config.yaml
  - cilium.yaml
  - metallb.yaml
  - metallb-config.yaml
  - traefik.yaml
  - metrics-server.yaml
  - kube-state-metrics.yaml
  - k8s-monitoring.yaml
  - external-secrets.yaml
  - external-secrets-config.yaml
  - dotdev-web.yaml
  - dotdev-studio.yaml
  - dotdev-labs.yaml
  - fidara.yaml
  - twt-web.yaml
  - twt-admin.yaml

labels:
  - pairs:
      platform.dsqr.dev/cluster: hub-a
      platform.dsqr.dev/environment: lab

# Only hub-a retains the legacy Pulumi ownership exception.
patches:
  - target:
      group: argoproj.io
      kind: Application
      name: cilium
    patch: |-
      - op: add
        path: /spec/ignoreDifferences/-
        value:
          group: '*'
          kind: '*'
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
